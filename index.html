<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff4e8">
<title>Our Little Journey · Bhoomika</title>
<style>
:root {
  --paper: #f9f5eb;
  --ink: #292d22;
  --green: #3e523a;
  --gold: #e2b44e;
  --muted: #626554;
  --line: #dad3bf;
  --serif: Baskerville, Georgia, serif;
  --mono: "Courier Prime", "Courier New", monospace;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 1rem/1.55 system-ui, sans-serif;
}
button, input, textarea { font: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
a { color: var(--green); }
button { cursor: pointer; }
:focus-visible { outline: 3px solid #956805; outline-offset: 4px; }
img { display: block; max-width: 100%; }
h1, h2, h3, p, figure { margin: 0; }
[hidden] { display: none !important; }
.wrap { width: min(1120px, calc(100% - 4rem)); margin-inline: auto; }
header { border-block: 5px solid var(--green); border-bottom: 1px solid var(--line); }
.nav { min-height: 4.6rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.brand { color: var(--ink); font: 600 1.65rem/1 var(--serif); text-decoration: none; }
.nav-links { display: flex; align-items: center; gap: 1.4rem; }
.nav-links a, .text-button { color: var(--green); font: 600 .82rem var(--mono); }
.text-button { padding: .6rem 0; background: none; border: 0; text-decoration: underline; }
.eyebrow { color: var(--green); font: 700 .85rem/1.4 var(--mono); letter-spacing: .12em; text-transform: uppercase; }
h1 { font: 500 clamp(3.45rem, 7.3vw, 6.4rem)/.93 var(--serif); letter-spacing: -.07em; margin: .9rem 0 1.25rem; }
h1 em { color: var(--green); font-weight: 400; }
.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  color: #fffdf4;
  background: var(--green);
  padding: .75rem 1.05rem;
  border: 1px solid var(--green);
  border-radius: 4px;
  font-size: .92rem;
  font-weight: 650;
}
.button:hover { background: #2d3e2b; }
.button.secondary { color: var(--green); background: transparent; }
.button.secondary:hover { background: #eaeada; }
.print {
  margin: 0;
  overflow: hidden;
  border: 1px solid #45483a;
  background: #292d25;
  color: #f3e9cb;
  padding: .5rem .5rem .35rem;
  border-radius: 4px;
  box-shadow: 0 7px 22px #3c352132;
}
.print img, .missing-photo { width: 100%; height: auto; aspect-ratio: 3 / 2; object-fit: cover; }
.print figcaption {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .5rem;
  min-height: 1.8rem;
  padding: .35rem .15rem .1rem;
  font: .75rem/1.3 var(--mono);
}
.print figcaption span:last-child { color: #edbe56; }
.journey { border-top: 1px solid var(--line); padding-block: 2.2rem 3.5rem; scroll-margin-top: 1rem; }
.section-head { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }
h2 { font: 500 clamp(2rem, 5vw, 3.3rem)/1 var(--serif); letter-spacing: -.045em; }
.timeline { list-style: none; margin: 0; padding: 0 0 0 2rem; border-left: 1px solid #b5b897; }
.moment {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  align-items: center;
  gap: clamp(1rem, 4vw, 3rem);
  padding: .4rem 0 2rem;
}
.moment:last-child { padding-bottom: .4rem; }
.moment::before {
  content: "";
  position: absolute;
  top: 1rem;
  left: calc(-2rem - 7px);
  width: 11px;
  height: 11px;
  border: 2px solid var(--paper);
  border-radius: 50%;
  background: #a96a12;
}
.moment-text { grid-column: 2; grid-row: 1; overflow-wrap: anywhere; }
.moment .print { grid-column: 1; grid-row: 1; }
.moment h3 { font: 500 clamp(1.9rem, 4vw, 2.9rem)/1.05 var(--serif); letter-spacing: -.045em; margin: .5rem 0 .65rem; }
.moment p { color: var(--muted); white-space: pre-wrap; }
.moment time { font: .8rem/1.4 var(--mono); color: var(--green); }
.moment .text-button { margin-top: .5rem; }
.missing-photo {
  display: grid;
  place-items: center;
  min-height: 100px;
  background: #e8dec1;
  background-image: radial-gradient(ellipse at center, #f7eed5, #e8dec1);
  color: #535740;
  font: .8rem var(--mono);
  text-align: center;
  gap: .1rem;
  align-content: center;
}

footer {
  border-top: 1px solid var(--line);
  color: var(--muted);

  align-items: center;
  justify-content: center;
  gap: .5rem;
  padding: .8rem 1rem 1rem;
  font: italic 1.08rem var(--serif);
}
dialog {
  width: min(calc(100% - 2rem), 34rem);
  max-height: 90dvh;
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 7px;
  color: var(--ink);
  background: #fffbf2;
  padding: clamp(1rem, 5vw, 2rem);
  box-shadow: 0 14px 55px #292d2245;
}
dialog::backdrop { background: #292d2280; }
dialog h2 { font-size: 2rem; margin-bottom: 1rem; }
label { display: grid; gap: .25rem; margin-bottom: .85rem; font-weight: 600; }
input, textarea {
  width: 100%;
  padding: .48rem .55rem;
  border: 1px solid #aaad95;
  border-radius: 3px;
  color: var(--ink);
  background: #fffdf8;
  font-weight: 400;
}
textarea { resize: vertical; }
.form-actions { display: flex; flex-wrap: wrap; gap: .5rem; }
.form-error { color: #a1392c; margin-bottom: .6rem; }
.status { margin: 0 0 .7rem; color: var(--green); font-size: .9rem; }
@media (max-width: 700px) {
  .wrap { width: calc(100% - 2rem); }
  .nav-links { gap: .75rem; }
  .nav { min-height: 3.5rem; }
  .brand { font-size: clamp(1.03rem, 5vw, 1.3rem); white-space: nowrap; }
  .nav-links a, .nav-links button { font-size: .75rem; }
  .section-head h2 { font-size: clamp(1.7rem, 8vw, 2rem); }
  .section-head .button { white-space: nowrap; }
  .timeline { padding-left: 1rem; }
  .moment { display: flex; align-items: stretch; flex-direction: column; }
  .moment::before { left: calc(-1rem - 6px); }
  .moment-text, .moment .print { width: 100%; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
:root {
  --paper: #fff4e8;
  --ink: #33232c;
  --green: #6d283f;
  --gold: #f4c65c;
  --muted: #684b5c;
  --line: #e4bfc2;
  --mono: "Courier Prime", "Courier New", monospace;
}
body {
  background-color: var(--paper);
  background-image: radial-gradient(#ebc9c2 1px, transparent 1px);
  background-size: 16px 16px;
}
header { border-block: 0; border-bottom: 1px solid #e7c8c4; background: #fff9ef; }
.nav { min-height: 4.7rem; }
.brand {
  display: inline-flex;
  align-items: center;
  gap: .55rem;
  font: 900 1.05rem/1.15 var(--mono);
  letter-spacing: -.025em;
  text-transform: uppercase;
}
.brand .pixel-heart { width: 1.15rem; }
.nav-links { gap: .65rem 1.3rem; }
.nav-links button { text-underline-offset: .24em; }
.player-main { --frame: #33232c; }
.console {
  width: min(830px, 100%);
  margin: clamp(1.4rem, 7vw, 4.8rem) auto 2.65rem;
  background: #fffaf0;
  border: 2px solid var(--frame);
  border-radius: 1.2rem;
  box-shadow: 0 7px 0 var(--frame), 0 15px 28px #61344831;
  padding: clamp(.72rem, 3.3vw, 1.85rem);
}
.console-top, .console-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .85rem;
}
.console-top {
  padding: .15rem .15rem .85rem;
  color: #623846;
  font: 700 .82rem/1 var(--mono);
  letter-spacing: .08em;
  text-transform: uppercase;
}
.console-top p { margin: 0; }
.hearts { display: flex; gap: .3rem; align-items: center; }
.pixel-heart {
  --heart-shape: polygon(0 20%,10% 20%,10% 10%,40% 10%,40% 20%,60% 20%,60% 10%,90% 10%,90% 20%,100% 20%,100% 55%,90% 55%,90% 65%,80% 65%,80% 75%,70% 75%,70% 85%,60% 85%,60% 95%,40% 95%,40% 85%,30% 85%,30% 75%,20% 75%,20% 65%,10% 65%,10% 55%,0 55%);
  position: relative;
  display: inline-block;
  flex: none;
  width: 1.3rem;
  aspect-ratio: 1;
  background: #754458;
  clip-path: var(--heart-shape);
}
.pixel-heart::before {
  position: absolute;
  content: "";
  inset: 0;
  background: #fff2f4;
  clip-path: var(--heart-shape);
  transform: scale(.74);
}
.pixel-heart.filled::before { background: #df526e; }
.screen {
  display: grid;
  background: #fce8ed;
  border: 3px solid var(--frame);
  border-radius: .6rem;
  box-shadow: inset 0 3px 0 #c36b8f28;
  min-height: 355px;
  overflow: hidden;
}
.scene {
  display: grid;
  grid-template-columns: 1.1fr .9fr;
  align-items: center;
  gap: clamp(.75rem, 3vw, 1.8rem);
  padding: clamp(1.2rem, 5vw, 2.8rem);
}
.scene[data-stage="finish"] { background: #fcecca; }
.scene[data-stage="memory"] { background: #fcf0f1; }
.scene-copy { min-width: 0; }
.scene-copy h1, .scene-copy h2 {
  color: #6f203a;
  font: 900 clamp(2rem, 6vw, 3.7rem)/.98 var(--mono);
  letter-spacing: -.075em;
  overflow-wrap: anywhere;
  text-transform: uppercase;
}
.scene-copy h2 { font-size: clamp(1.7rem, 4.5vw, 2.8rem); }
.scene-copy .chapter {
  margin-bottom: .65rem;
  color: #754458;
  font: 700 .85rem/1.3 var(--mono);
  text-transform: uppercase;
}
.scene-copy p:not(.chapter) { margin-top: 1rem; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
.scene-copy time { color: var(--muted); font: .9rem/1.4 var(--mono); display: block; margin-top: .65rem; }
.scene-art { display: grid; place-items: center; min-width: 0; }
.sprite { width: min(100%, 285px); height: auto; }
.scene-art .print { width: 100%; transform: rotate(2deg); background: #33232c; border-color: #33232c; }
.scene-art .print img { object-fit: contain; background: #251c26; }
.scene-art .missing-photo { background: #f9dce5; color: #694052; }
.console-bottom { padding: .95rem .15rem .05rem; }
.console-buttons { display: flex; gap: .6rem; flex-wrap: wrap; }
.button {
  color: #fffaf2;
  background: #91354e;
  border: 2px solid #512238;
  border-radius: 4px;
  box-shadow: 0 3px 0 #512238;
  font: 700 .9rem/1.2 var(--mono);
  padding: .72rem .9rem;
}
.button:hover { background: #79283f; }
.button:active { transform: translateY(2px); box-shadow: 0 1px 0 #512238; }
.button.secondary { background: #fff9ef; color: #6d283f; }
.button.secondary:hover { background: #feebee; }
.speaker {
  display: flex;
  gap: .3rem;
  transform: rotate(-22deg);
  margin-right: .45rem;
}
.speaker i { height: 1.05rem; width: 3px; display: block; border-radius: 2px; background: #a78a87; }
.journey { border: 0; padding-top: 0; }
.journey .section-head { flex-wrap: wrap; }
.journey .section-head h2 { width: min-content; }
.timeline { border-color: #d093a5; }
.moment::before { background: #a73e62; }
.moment .print { background: #33232c; border-color: #33232c; }
footer { background: #fff9ef; }
@media (max-width: 700px) {
  .nav { min-height: 3.6rem; }
  .nav-links { flex-wrap: wrap; justify-content: flex-end; gap: 0 .65rem; }
  .nav-links button { padding: .45rem 0; }
  .console { margin-bottom: 1.85rem; }
  .scene { grid-template-columns: 1fr; gap: .65rem; }
  .scene-copy h1 { font-size: clamp(1.95rem, 10vw, 3.5rem); }
  .scene-copy p:not(.chapter) { margin-top: .65rem; }
  .scene-art .sprite { width: min(65%, 185px); }
  .console-bottom { padding-top: .8rem; }
}
</style>
</head>

<template id="moment-template">
  <li class="moment">
    <div class="moment-text">
      <time hidden></time>
      <h3></h3>
      <p class="memory-note" hidden></p>
      <button class="text-button edit" type="button" data-editor>Edit moment</button>
    </div>
    <figure class="print">
      <img alt="" loading="lazy" hidden>
      <div class="missing-photo"><span class="motif bear" aria-hidden="true"></span><span>No photo yet</span></div>
      <figcaption><span>From our camera roll</span><span>35 mm</span></figcaption>
    </figure>
  </li>
</template>
<dialog id="editor" aria-labelledby="editor-title">
  <form id="moment-form">
    <h2 id="editor-title">Add a moment</h2>
    <label>What happened?<input name="title" maxlength="100" required></label>
    <label>Date (optional)<input name="date" type="date"></label>
    <label>What do you remember? (optional)<textarea name="note" rows="3" maxlength="1200"></textarea></label>
    <label>Photo (optional)<input name="photo" type="file" accept="image/*"></label>
    <p class="form-error" id="form-error" role="alert" hidden></p>
    <div class="form-actions">
      <button type="submit" class="button" id="submit">Save moment</button>
      <button type="button" class="button secondary" id="cancel">Cancel</button>
    </div>
  </form>
</dialog>
<script type="application/json" id="journey-data">{"editable":true,"moments":[{"id":"hinge","title":"We matched on Hinge","date":"","note":"Of all the people I could’ve met on Hinge, I’m glad it was you.","photo":""}]}</script>
<script>
const $ = id => document.getElementById(id);
const source = JSON.parse($('journey-data').textContent);
const storageKey = 'littlePost.journey.v1';
const editor = $('editor');
const form = $('moment-form');
const fields = form.elements;
let moments = source.moments;
let activeId = null;

if (source.editable) {
  try {
    const saved = JSON.parse(localStorage.getItem(storageKey));
    if (Array.isArray(saved) && saved.length) moments = saved;
  } catch {
    showStatus('This browser could not load saved changes.');
  }
}

function showStatus(message) {
  $('status').textContent = message;
  $('status').hidden = false;
}

let stage = -1;

function datedMoments() {
  const orderKey = moment => moment.id === 'hinge' ? '' : (moment.date || '9999');
  return [...moments].sort((first, second) => orderKey(first).localeCompare(orderKey(second)));
}

function populateMemory(container, moment) {
  container.querySelector('h2, h3').textContent = moment.title;
  const note = container.querySelector('.memory-note');
  note.textContent = moment.note;
  note.hidden = !moment.note;
  if (moment.date) {
    const date = container.querySelector('time');
    date.dateTime = moment.date;
    date.textContent = new Intl.DateTimeFormat('en-IN', { dateStyle: 'medium' })
      .format(new Date(moment.date + 'T12:00:00'));
    date.hidden = false;
  }
  if (moment.photo) {
    const photo = container.querySelector('img');
    photo.src = moment.photo;
    photo.alt = 'Photo from ' + moment.title;
    photo.hidden = false;
    container.querySelector('.missing-photo').hidden = true;
  }
}

function renderPlayer(moveFocus = false) {
  const story = datedMoments();
  const finished = stage >= story.length;
  const opening = stage < 0;
  const sceneName = opening ? 'welcome' : (finished ? 'finish' : 'memory');
  const content = $(sceneName + '-scene').content.cloneNode(true);
  const scene = $('scene');
  if (sceneName === 'memory') {
    content.querySelector('.chapter').textContent = 'Memory ' + (stage + 1) + ' of ' + story.length;
    populateMemory(content, story[stage]);
  }
  scene.dataset.stage = sceneName;
  scene.replaceChildren(content);

  const count = opening ? 0 : (finished ? 3 : Math.ceil(2 * (stage + 1) / story.length));
  const hearts = $('hearts');
  hearts.setAttribute('aria-label', count + ' of 3 hearts filled');
  [...hearts.children].forEach((heart, index) => heart.classList.toggle('filled', index < count));

  const advance = $('advance');
  advance.textContent = opening ? 'Start' : (finished ? 'Play again' : (stage === story.length - 1 ? 'See the surprise' : 'Next memory'));
  $('previous').hidden = opening;
  if (moveFocus) scene.querySelector('h1, h2').focus({ preventScroll: true });
}

function setTimeline(open, moveFocus = false) {
  $('journey').hidden = !open;
  const control = $('timeline-toggle');
  control.setAttribute('aria-expanded', String(open));
  control.textContent = open ? 'Hide timeline' : 'Timeline';
  if (moveFocus) (open ? $('journey-title') : control).focus();
}

$('advance').addEventListener('click', () => {
  stage = stage >= moments.length ? -1 : stage + 1;
  renderPlayer(true);
});
$('previous').addEventListener('click', () => {
  if (stage < 0) return;
  stage -= 1;
  renderPlayer(true);
});
$('timeline-toggle').addEventListener('click', () => setTimeline($('journey').hidden, true));

function render() {
  const rows = datedMoments().map(moment => {
    const row = $('moment-template').content.cloneNode(true);
    populateMemory(row, moment);
    const edit = row.querySelector('.edit');
    edit.hidden = !source.editable;
    edit.setAttribute('aria-label', 'Edit moment: ' + moment.title);
    edit.addEventListener('click', () => openEditor(moment));
    if (!moment.photo) {
      row.querySelector('figcaption span').textContent = 'Photo slot';
      if (!source.editable) row.querySelector('figure').hidden = true;
    }
    return row;
  });
  $('timeline').replaceChildren(...rows);
  renderPlayer();
}

function openEditor(moment) {
  activeId = moment?.id ?? null;
  form.reset();
  fields.title.value = moment?.title ?? '';
  fields.date.value = moment?.date ?? '';
  fields.note.value = moment?.note ?? '';
  $('editor-title').textContent = moment ? 'Edit moment' : 'Add a moment';
  $('form-error').hidden = true;
  editor.showModal();
  fields.title.focus();
}

async function preparePhoto(file) {
  const url = URL.createObjectURL(file);
  try {
    const photo = new Image();
    photo.src = url;
    await photo.decode();
    const scale = Math.min(1, 1100 / Math.max(photo.naturalWidth, photo.naturalHeight));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(photo.naturalWidth * scale));
    canvas.height = Math.max(1, Math.round(photo.naturalHeight * scale));
    const context = canvas.getContext('2d');
    context.fillStyle = '#f9f5eb';
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.drawImage(photo, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL('image/jpeg', .79);
  } catch {
    throw new Error('This photo could not be opened. Try a JPG or PNG.');
  } finally {
    URL.revokeObjectURL(url);
  }
}

$('add').addEventListener('click', () => openEditor());
$('cancel').addEventListener('click', () => editor.close());
editor.addEventListener('cancel', event => {
  if ($('submit').disabled) event.preventDefault();
});
form.addEventListener('submit', async event => {
  event.preventDefault();
  const title = fields.title.value.trim();
  if (!title) {
    fields.title.focus();
    return;
  }
  $('submit').disabled = true;
  $('cancel').disabled = true;
  $('form-error').hidden = true;
  try {
    const current = moments.find(moment => moment.id === activeId);
    const file = fields.photo.files[0];
    const updated = {
      id: activeId || (globalThis.crypto?.randomUUID?.() ?? String(Date.now())),
      title,
      date: fields.date.value,
      note: fields.note.value.trim(),
      photo: file ? await preparePhoto(file) : (current?.photo ?? '')
    };
    const next = activeId ? moments.map(moment => moment.id === activeId ? updated : moment) : [...moments, updated];
    try {
      localStorage.setItem(storageKey, JSON.stringify(next));
    } catch {
      showStatus('This browser could not save the changes.');
    }
    moments = next;
    render();
    editor.close();
  } catch (error) {
    $('form-error').textContent = error.message;
    $('form-error').hidden = false;
  } finally {
    $('submit').disabled = false;
    $('cancel').disabled = false;
  }
});

if (!source.editable) document.querySelectorAll('[data-editor]').forEach(control => control.hidden = true);
setTimeline(false);
render();
</script>
</body>
</html>
